<div class="progress" aria-hidden="true">
  <span class="progress__fill" [style.transform]="'scaleX(' + scroll.progress() + ')'"></span>
</div>

<header class="nav" [class.is-condensed]="scroll.scrolled()">
  <div class="nav__inner shell">
    <button class="nav__brand" type="button" (click)="go('hero')" appMagnetic [strength]="8"
            aria-label="Back to top">
      <span class="nav__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30" fill="none">
          <circle cx="16" cy="16" r="15" stroke="url(#brand-grad)" stroke-width="1.2" />
          <path d="M9 11h14M16 11v13" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" />
          <defs>
            <linearGradient id="brand-grad" x1="0" y1="0" x2="32" y2="32">
              <stop stop-color="#7c5cff" />
              <stop offset="1" stop-color="#00d9c0" />
            </linearGradient>
          </defs>
        </svg>
      </span>
      <span class="nav__brand-text">
        <span class="nav__brand-name">Timosh</span>
        <span class="nav__brand-role">{{ profile.role }}</span>
      </span>
    </button>

    <nav class="nav__links" aria-label="Sections">
      @for (link of links; track link.id) {
        @if (link.id !== 'hero') {
          <button type="button" class="nav__link"
                  [class.is-active]="scroll.activeSection() === link.id"
                  (click)="go(link.id)">
            <span class="nav__link-index">{{ link.index }}</span>
            <span class="nav__link-label">{{ link.label }}</span>
          </button>
        }
      }
    </nav>

    <div class="nav__actions">
      <a class="nav__cta" [href]="'mailto:' + profile.email" appMagnetic [strength]="10"
         data-cursor="Email">
        <span>Let's talk</span>
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" aria-hidden="true">
          <path d="M3 13L13 3M13 3H5.5M13 3v7.5" stroke="currentColor" stroke-width="1.4"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>

      <button class="nav__burger" type="button" (click)="toggle()"
              [attr.aria-expanded]="menuOpen()" aria-controls="mobile-menu"
              [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'">
        <span [class.is-open]="menuOpen()"></span>
        <span [class.is-open]="menuOpen()"></span>
      </button>
    </div>
  </div>
</header>

<div class="sheet" id="mobile-menu" [class.is-open]="menuOpen()" [attr.inert]="menuOpen() ? null : ''">
  <nav class="sheet__nav" aria-label="Sections">
    @for (link of links; track link.id) {
      <button type="button" class="sheet__link" (click)="go(link.id)">
        <span class="sheet__index">{{ link.index }}</span>
        {{ link.label }}
      </button>
    }
  </nav>
  <div class="sheet__foot">
    <a [href]="'mailto:' + profile.email">{{ profile.email }}</a>
    <a [href]="profile.linkedin" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  </div>
</div>
